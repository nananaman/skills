<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>$date スキル振り返り</title>
<style>
:root { color-scheme:light dark; --page:#f4f7f4; --surface:#fff; --ink:#183632; --muted:#566963; --line:#8b9d92; --head:#e7f0eb; --focus:#176b5a; }
@media(prefers-color-scheme:dark) { :root { --page:#0f1a16; --surface:#172822; --ink:#e4eee7; --muted:#adc2b4; --line:#719780; --head:#203c30; --focus:#8bdab1; } }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:var(--page); font:14px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
main { max-width:1120px; margin:auto; padding:24px 20px 36px; }
header { margin-bottom:24px; }
h1 { margin:0 0 6px; font-size:24px; line-height:1.4; }
h2 { margin:0 0 10px; font-size:18px; line-height:1.4; }
p { margin:7px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
.date,.period { color:var(--muted); font-size:12px; }
.period { margin-top:10px; }
.metrics { margin-top:12px; padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-weight:600; font-variant-numeric:tabular-nums; }
section { margin:24px 0; }
.table-scroll { width:100%; overflow-x:auto; }
.table-scroll:focus-visible,summary:focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
table { width:100%; border-collapse:collapse; table-layout:fixed; background:var(--surface); }
caption { text-align:left; color:var(--muted); padding:0 0 8px; font-size:12px; }
th,td { text-align:left; vertical-align:top; padding:10px 12px; border-bottom:1px solid var(--line); white-space:pre-wrap; overflow-wrap:anywhere; }
th { background:var(--head); font-weight:600; }
th:first-child:nth-last-child(3) { width:25%; }
th:first-child:nth-last-child(3)~th { width:37.5%; }
th:first-child:nth-last-child(2) { width:27%; }
th:first-child:nth-last-child(2)~th { width:73%; }
details th:nth-child(2):nth-last-child(2) { width:15%; }
details th:nth-child(3):last-child { width:60%; }
table.decisions th:first-child { width:15%; }
table.decisions th:nth-child(2) { width:35%; }
table.decisions th:nth-child(3) { width:50%; }
a { color:var(--focus); }
a:focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
strong { font-weight:600; }
details { margin:18px 0; }
summary { cursor:pointer; font-weight:600; padding:10px 0; border-top:1px solid var(--line); }
details[open] summary { margin-bottom:8px; }
details p { margin-bottom:12px; }
footer { margin-top:26px; padding-top:12px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
@media(max-width:620px) { main { padding:18px 12px 28px; } th,td { padding:8px 7px; } h1 { font-size:21px; } }
@media print { :root { color-scheme:light; } body { background:#fff; } main { padding:0; } details>* { display:block; } tr { break-inside:avoid; } }
</style>
</head>
<body><main>
<header>
<h1>$date スキル振り返り</h1>
<div class="date">日付基準　$timezone</div>
<p>$summary</p>
<div class="metrics" aria-label="今回の評価と実測">$metrics</div>
<p class="period">履歴の取得対象期間　$period</p>
</header>
$sections
<footer>取得状態と精読の完了、検証の成功と採用を分けて記録しています。</footer>
</main></body>
</html>
