name: Go CLI contracts (Mac)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: plugin/skills/apm-usage/go.sum
      - name: Inventory and plugin / standalone startup
        run: |
          go run -mod=readonly ./scripts/check-skill-inventory --root .
          go test -mod=readonly -race ./...
          go vet ./...
      - name: Skill contracts
        run: |
          for skill in apm-usage review-diff-code skill-maintenance skill-workbench; do
            go -C "plugin/skills/$skill" test -mod=readonly -race ./...
            go -C "plugin/skills/$skill" vet ./...
          done
