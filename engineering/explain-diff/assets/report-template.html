<!doctype html>
<html lang="ja" data-explain-diff-report="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="explain-diff-fingerprint" content="__REPORT_FINGERPRINT__">
  <title>Explain Diff</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f7fb;
      --panel: #ffffff;
      --ink: #20242c;
      --muted: #68707d;
      --line: #dfe3ea;
      --blue: #3068e8;
      --blue-soft: #edf3ff;
      --red: #cf3f4f;
      --red-soft: #fff0f1;
      --amber: #b77800;
      --amber-soft: #fff5d9;
      --green: #22845c;
      --green-soft: #e7f6ee;
      --add: #e8f6ec;
      --add-strong: #ccead5;
      --delete: #fff0f0;
      --delete-strong: #f5d2d5;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
    }

    button, textarea { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto minmax(220px, 1fr);
      align-items: center;
      gap: 24px;
      min-height: 92px;
      padding: 18px 32px;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 22px;
      min-width: 0;
    }

    .eyebrow, .section-kicker {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .title-wrap { min-width: 0; }
    .title-wrap h1 {
      margin: 0;
      overflow: hidden;
      font-size: clamp(18px, 2vw, 26px);
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .branch {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
    }

    .stats {
      display: flex;
      gap: 12px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      font-family: var(--mono);
      white-space: nowrap;
    }

    .stats .plus { color: var(--green); }
    .stats .minus { color: var(--red); }

    .progress-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }

    .progress-track {
      width: min(190px, 50%);
      height: 8px;
      overflow: hidden;
      background: #e8ebf1;
      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: var(--blue);
      transition: width .2s ease;
    }

    .progress-label {
      color: var(--muted);
      font-family: var(--mono);
      font-weight: 700;
      white-space: nowrap;
    }

    .page {
      width: min(1880px, calc(100% - 40px));
      margin: 24px auto 80px;
    }

    .section-kicker { margin: 0 0 14px 4px; }

    .story-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 1px;
      overflow: hidden;
      margin-bottom: 24px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(26, 34, 50, .05);
    }
    .story-step { padding: 24px 28px; background: var(--panel); }
    .story-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 800;
    }
    .story-value { margin: 0; font-size: 17px; line-height: 1.55; }

    .system-overview {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(320px, 2fr);
      gap: 20px;
      margin-bottom: 28px;
    }
    .system-overview.without-architecture { grid-template-columns: 1fr; }
    .architecture-panel, .changed-files-panel {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(26, 34, 50, .05);
    }
    .architecture-panel[hidden] { display: none; }
    .overview-panel-head {
      margin: 0;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
    }
    .changed-files { display: grid; }
    .changed-file {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
    }
    .changed-file:last-child { border-bottom: 0; }
    .changed-file-path {
      overflow: hidden;
      font-family: var(--mono);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .review-workspace {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) minmax(280px, 340px);
      gap: 20px;
      align-items: start;
    }

    .group-rail, .context-rail {
      position: sticky;
      top: 116px;
      max-height: calc(100vh - 136px);
      overflow: auto;
      scrollbar-gutter: stable;
    }

    .review-main { min-width: 0; }
    .context-rail { display: grid; gap: 18px; }
    .context-panel {
      min-height: 0;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(26, 34, 50, .05);
    }
    .context-panel[hidden] { display: none; }
    .context-panel-head {
      position: sticky;
      top: 0;
      z-index: 2;
      margin: 0;
      padding: 13px 16px;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .context-glossary { max-height: min(34vh, 360px); overflow: auto; }

    .overview {
      display: block;
      margin-bottom: 36px;
    }

    .overview-card {
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(26, 34, 50, .05);
    }

    .overview-title {
      margin: 0 0 16px;
      font-size: 14px;
      font-weight: 760;
    }

    .glossary-card {
      display: block;
      gap: 1px;
      overflow: hidden;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: var(--line);
      box-shadow: none;
    }
    .glossary-entry {
      padding: 14px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      transition: background .18s ease, box-shadow .18s ease;
    }
    .glossary-entry:last-child { border-bottom: 0; }
    .glossary-entry.context-active {
      background: var(--blue-soft);
      box-shadow: inset 3px 0 var(--blue);
    }
    .glossary-term { margin: 0 0 5px; font-family: var(--mono); font-size: 13px; font-weight: 800; }
    .glossary-definition { margin: 0; color: var(--muted); font-size: 13px; }
    .term-link {
      padding: 0;
      border: 0;
      border-bottom: 1px dotted currentColor;
      background: transparent;
      color: var(--blue);
      cursor: pointer;
      font-size: 11px;
    }
    .diagram-list { display: grid; gap: 1px; background: var(--line); }
    .diagram-card { padding: 16px; border: 0; border-radius: 0; box-shadow: none; }
    .diagram-description { margin: 5px 0 16px; color: var(--muted); }
    .mermaid-output { overflow: auto; }
    .mermaid-linked-node { cursor: pointer; }
    .mermaid-linked-node:focus { outline: 3px solid rgba(48, 104, 232, .35); outline-offset: 3px; }
    .mermaid-linked-node.context-active > * {
      filter: drop-shadow(0 0 5px rgba(48, 104, 232, .55));
    }
    .group-list {
      overflow: hidden;
      margin-bottom: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(26, 34, 50, .05);
    }

    .reading-path {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: -5px 4px 12px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.4;
    }
    .reading-path::before { color: var(--blue); content: "↓"; font-size: 16px; }

    .group-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 16px 14px 16px 20px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .group-row:last-child { border-bottom: 0; }
    .group-row::before {
      position: absolute;
      inset: 14px auto 14px 0;
      width: 5px;
      background: var(--group-color, #cbd1db);
      content: "";
    }

    .group-row.active { background: #fafcff; }
    .group-row:focus-visible { outline: 3px solid rgba(48, 104, 232, .3); outline-offset: -3px; }

    .group-main { min-width: 0; }
    .group-title-line {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 3px;
    }

    .group-title {
      overflow: hidden;
      font-size: 14px;
      font-weight: 760;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-summary {
      display: -webkit-box;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .group-dependencies {
      margin-top: 7px;
      color: var(--blue);
      font-family: var(--mono);
      font-size: 11px;
    }

    .badges {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 3px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #f8f9fb;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
    }

    .badge.pending { border-color: transparent; color: #8a5b00; background: var(--amber-soft); }
    .badge.checked { border-color: transparent; color: var(--green); background: var(--green-soft); }

    .detail-card, .feedback-card {
      overflow: hidden;
      margin-bottom: 36px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(26, 34, 50, .05);
    }
    .group-sections { display: grid; gap: 28px; margin-bottom: 36px; }
    .group-sections .detail-card { margin-bottom: 0; scroll-margin-top: 116px; }

    .detail-head {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      padding: 28px 32px 26px 38px;
      border-bottom: 1px solid var(--line);
    }

    .detail-head::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      background: #cbd1db;
      content: "";
    }

    .detail-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.35;
    }

    .explanation { margin: 0; font-size: 16px; }
    .explanation strong { color: var(--green); }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .meta-item {
      padding: 13px 15px;
      background: #f7f8fa;
      border-radius: 10px;
    }

    .meta-label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .review-check {
      display: flex;
      align-items: center;
      align-self: start;
      gap: 10px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-weight: 750;
      cursor: pointer;
      white-space: nowrap;
    }

    .review-check input { width: 19px; height: 19px; accent-color: var(--blue); }

    .improvement-note {
      margin-top: 16px;
      padding: 11px 14px;
      color: #8d2633;
      background: var(--red-soft);
      border-radius: 9px;
    }

    .file-diff {
      overflow: hidden;
      margin: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }
    .file-diff-header {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 44px;
      padding: 9px 14px;
      color: var(--ink);
      background: #f6f8fa;
      border-bottom: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 750;
    }
    .file-toggle {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1;
      gap: 9px;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      text-align: left;
    }
    .file-toggle::before {
      display: inline-block;
      width: 14px;
      content: "▾";
      transition: transform .15s ease;
    }
    .file-toggle[aria-expanded="false"]::before { transform: rotate(-90deg); }
    .file-path { min-width: 0; overflow-wrap: anywhere; }
    .file-review-check {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
    }
    .file-review-check input { width: 17px; height: 17px; accent-color: var(--blue); }
    .file-diff-body[hidden] { display: none; }
    .file-hunk + .file-hunk { border-top: 1px solid var(--line); }
    .hunk-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      color: var(--muted);
      background: #f6f8fa;
      border-bottom: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 11px;
    }

    .diff-scroll { overflow-x: auto; }
    .diff-table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
    }

    .diff-row { position: relative; }
    .diff-row:hover .line-comment-button { opacity: 1; }
    .diff-row.add { background: var(--add); }
    .diff-row.delete { background: var(--delete); }
    .diff-row.header { color: var(--muted); background: #f4f6f9; }

    .line-number {
      width: 54px;
      padding: 1px 9px;
      color: #949ba7;
      border-right: 1px solid rgba(0, 0, 0, .06);
      text-align: right;
      user-select: none;
    }

    .diff-code {
      position: relative;
      padding: 1px 44px 1px 14px;
      white-space: pre;
    }
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: #6e7781; font-style: italic; }
    .token.keyword, .token.atrule { color: #cf222e; }
    .token.string, .token.char, .token.attr-value, .token.regex { color: #0a3069; }
    .token.number, .token.boolean, .token.constant, .token.symbol { color: #0550ae; }
    .token.function, .token.class-name { color: #8250df; }
    .token.operator, .token.entity, .token.url { color: #953800; }
    .token.property, .token.tag, .token.selector, .token.attr-name { color: #116329; }
    .token.punctuation { color: #57606a; }
    .token-prefix { color: inherit; }
    .group-color-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--group-color);
    }

    .line-comment-button {
      position: absolute;
      right: 8px;
      top: 2px;
      width: 28px;
      height: 24px;
      opacity: 0;
      border: 1px solid #bec7d5;
      border-radius: 6px;
      color: var(--blue);
      background: #fff;
      cursor: pointer;
    }

    .line-comment-button.has-comment { opacity: 1; color: #fff; background: var(--blue); }

    .line-comment-editor td {
      padding: 10px 18px 14px 122px;
      background: var(--blue-soft);
    }

    textarea {
      width: 100%;
      min-height: 82px;
      resize: vertical;
      padding: 10px 12px;
      border: 1px solid #cbd2de;
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
    }

    textarea:focus { border-color: var(--blue); outline: 3px solid rgba(48, 104, 232, .13); }

    .group-comment {
      padding: 24px 32px 30px;
      border-top: 1px solid var(--line);
    }

    .group-comment label, .feedback-intro {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .feedback-card { padding: 28px 32px 32px; }

    .feedback-counts, .feedback-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .feedback-actions button {
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 9px;
      font-weight: 750;
      cursor: pointer;
    }

    .primary { color: #fff; border-color: var(--blue) !important; background: var(--blue); }
    .secondary { color: var(--ink); background: #fff; }

    .feedback-output {
      display: none;
      max-height: 430px;
      overflow: auto;
      margin: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8f9fb;
      font-family: var(--mono);
      font-size: 13px;
      white-space: pre-wrap;
    }

    .feedback-output.visible { display: block; }

    .empty {
      padding: 80px 24px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1280px) {
      .review-workspace {
        grid-template-columns: 220px minmax(0, 1fr);
      }
      .context-rail {
        position: static;
        grid-column: 1 / -1;
        grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr);
        max-height: none;
      }
      .context-diagram, .context-glossary { max-height: 460px; }
    }

    @media (max-width: 900px) {
      .topbar {
        position: static;
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 18px 20px;
      }
      .stats { width: max-content; max-width: 100%; overflow-x: auto; }
      .progress-wrap { justify-content: flex-start; }
      .page { width: min(100% - 24px, 1480px); margin-top: 20px; }
      .story-card { grid-template-columns: 1fr; }
      .system-overview { grid-template-columns: 1fr; }
      .review-workspace { display: block; }
      .group-rail, .context-rail {
        position: static;
        display: block;
        max-height: none;
        overflow: visible;
      }
      .group-rail, .review-main, .context-panel { margin-bottom: 20px; }
      .context-glossary { max-height: none; }
      .group-row, .detail-head { grid-template-columns: 1fr; }
      .badges { justify-content: flex-start; flex-wrap: wrap; }
      .detail-head { padding: 24px 22px 22px 28px; }
      .meta-grid { grid-template-columns: 1fr; }
      .review-check { justify-self: start; }
      .group-comment, .feedback-card { padding: 22px; }
      .line-comment-editor td { padding-left: 18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">Explain Diff</span>
      <div class="title-wrap">
        <h1 id="report-title">Local diff</h1>
        <div class="branch" id="branch"></div>
      </div>
    </div>
    <div class="stats" aria-label="差分統計">
      <span id="files-stat"></span>
      <span id="hunks-stat"></span>
      <span class="plus" id="additions-stat"></span>
      <span class="minus" id="deletions-stat"></span>
    </div>
    <div class="progress-wrap">
      <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
      <span class="progress-label" id="progress-label"></span>
    </div>
  </header>

  <main class="page" id="app">
    <section id="story-section" aria-labelledby="story-heading">
      <h2 class="section-kicker" id="story-heading">この変更の物語</h2>
      <div class="story-card">
        <div class="story-step">
          <span class="story-label">これまでの状態</span>
          <p class="story-value" id="story-context"></p>
        </div>
        <div class="story-step">
          <span class="story-label">この変更で到達する状態</span>
          <p class="story-value" id="story-outcome"></p>
        </div>
      </div>
    </section>

    <section class="system-overview without-architecture" id="system-overview" aria-label="変更の俯瞰">
      <article class="architecture-panel" id="overview-section" hidden>
        <h2 class="section-kicker overview-panel-head" id="overview-heading">変更後のアーキテクチャ</h2>
        <div class="overview" id="overview">
          <div class="diagram-list" id="diagram-list"></div>
        </div>
      </article>
      <article class="changed-files-panel">
        <h2 class="section-kicker overview-panel-head">変更対象ファイル</h2>
        <div class="changed-files" id="changed-files"></div>
      </article>
    </section>

    <div class="review-workspace">
      <nav class="group-rail" aria-labelledby="groups-heading">
        <h2 class="section-kicker" id="groups-heading">入口から読む</h2>
        <div class="reading-path">利用者に近い変更から、それを成り立たせる依存先へ</div>
        <div class="group-list" id="group-list"></div>
      </nav>

      <div class="review-main">
        <section aria-labelledby="detail-heading">
          <h2 class="section-kicker" id="detail-heading">変更内容</h2>
          <div class="group-sections" id="detail-card"></div>
        </section>

        <section aria-labelledby="feedback-heading">
          <h2 class="section-kicker" id="feedback-heading">フィードバック</h2>
          <div class="feedback-card">
            <div class="feedback-counts" id="feedback-counts"></div>
            <p class="feedback-intro">人間コメントと未確認グループを、元の実装セッションへ渡すMarkdownにまとめます。</p>
            <div class="feedback-actions">
              <button class="primary" id="generate-feedback" type="button">フィードバックを生成</button>
              <button class="secondary" id="copy-feedback" type="button">クリップボードにコピー</button>
            </div>
            <pre class="feedback-output" id="feedback-output" aria-live="polite"></pre>
          </div>
        </section>
      </div>

      <aside class="context-rail" aria-label="レビューの補助情報">
        <section class="context-panel context-glossary" id="glossary-section" aria-labelledby="glossary-heading" hidden>
          <h2 class="section-kicker context-panel-head" id="glossary-heading">用語集</h2>
          <div class="glossary-card" id="glossary-list"></div>
        </section>
      </aside>
    </div>
  </main>

  <script>__MERMAID_JS__</script>
  <script>__PRISM_JS__</script>
  <script id="report-data" type="application/octet-stream">__REPORT_DATA_BASE64__</script>
  <script>
    "use strict";

    const encoded = document.getElementById("report-data").textContent.trim();
    const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
    const report = JSON.parse(new TextDecoder().decode(bytes));
    const { snapshot, manifest } = report;
    const groups = manifest.groups;
    const diagrams = manifest.diagrams ?? [];
    const glossary = manifest.glossary ?? [];
    const hunks = new Map(snapshot.hunks.map(hunk => [hunk.id, hunk]));
    const storageKey = `explain-diff:${snapshot.fingerprint}`;
    const defaultState = {
      checked: {},
      fileChecked: {},
      fileCollapsed: {},
      groupComments: {},
      lineComments: {},
    };
    let state = loadState();
    let activeGroupId = groups[0]?.id ?? null;
    let feedback = "";

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        return {
          checked: saved?.checked ?? {},
          fileChecked: saved?.fileChecked ?? {},
          fileCollapsed: saved?.fileCollapsed ?? {},
          groupComments: saved?.groupComments ?? {},
          lineComments: saved?.lineComments ?? {},
        };
      } catch {
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state));
      } catch {
        // file URL でストレージを使えない場合も、レポートの閲覧は継続する。
      }
      feedback = "";
      document.getElementById("feedback-output").classList.remove("visible");
      updateProgress();
      renderGroupList();
      updateFeedbackCounts();
    }

    function groupColor(groupId) {
      const palette = ["#356ae6", "#b65b18", "#20845d", "#8b5cc7", "#c13f58", "#287b9e"];
      const index = Math.max(0, groups.findIndex(group => group.id === groupId));
      return palette[index % palette.length];
    }

    function groupHunks(group) {
      return group.hunk_ids.map(id => hunks.get(id)).filter(Boolean);
    }

    function groupHunksByPath(group) {
      const byPath = new Map();
      for (const hunk of groupHunks(group)) {
        const fileHunks = byPath.get(hunk.path) ?? [];
        fileHunks.push(hunk);
        byPath.set(hunk.path, fileHunks);
      }
      return [...byPath.entries()].map(([path, fileHunks]) => ({ path, hunks: fileHunks }));
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function badge(text, className = "") {
      return element("span", `badge ${className}`.trim(), text);
    }

    function renderHeader() {
      document.getElementById("report-title").textContent = manifest.title;
      document.getElementById("branch").textContent = `${snapshot.branch} · ${snapshot.fingerprint.slice(0, 12)}`;
      document.getElementById("files-stat").textContent = `${snapshot.stats.files} files`;
      document.getElementById("hunks-stat").textContent = `/ ${snapshot.stats.hunks} hunks`;
      document.getElementById("additions-stat").textContent = `+${snapshot.stats.additions}`;
      document.getElementById("deletions-stat").textContent = `−${snapshot.stats.deletions}`;
    }

    function renderStory() {
      document.getElementById("story-context").textContent = manifest.context;
      document.getElementById("story-outcome").textContent = manifest.outcome;
    }

    function renderChangedFiles() {
      const files = new Map();
      for (const hunk of snapshot.hunks) {
        const current = files.get(hunk.path) ?? { hunks: 0, groups: new Set() };
        current.hunks += 1;
        for (const group of groups) {
          if (group.hunk_ids.includes(hunk.id)) current.groups.add(group.id);
        }
        files.set(hunk.path, current);
      }
      const list = document.getElementById("changed-files");
      list.replaceChildren(...[...files.entries()].map(([path, info]) => {
        const row = element("div", "changed-file");
        row.append(
          element("span", "changed-file-path", path),
          badge(`${info.hunks} hunks · ${info.groups.size} groups`),
        );
        return row;
      }));
    }

    async function renderOverview() {
      if (!diagrams.length) return;
      document.getElementById("system-overview").classList.remove("without-architecture");
      document.getElementById("overview-section").hidden = false;
      const diagramList = document.getElementById("diagram-list");
      diagramList.replaceChildren(...await Promise.all(diagrams.map(renderMermaidDiagram)));
    }

    async function renderMermaidDiagram(diagram) {
      const card = element("article", "overview-card diagram-card");
      card.append(
        element("h3", "overview-title", diagram.title),
        element("p", "diagram-description", diagram.description),
      );
      const output = element("div", "mermaid-output");
      try {
        mermaid.initialize({
          startOnLoad: false,
          securityLevel: "strict",
          htmlLabels: false,
          suppressErrorRendering: true,
          theme: "neutral",
        });
        const rendered = await mermaid.render(`mermaid-${diagram.id}`, diagram.source);
        output.innerHTML = rendered.svg;
        for (const link of diagram.node_links ?? []) {
          const linkedNodes = [...output.querySelectorAll(".node[id]")].filter(node =>
            node.dataset.id === link.node_id ||
            node.id.includes(`flowchart-${link.node_id}-`)
          );
          if (!linkedNodes.length) {
            throw new Error(`Mermaid node link target not found: ${link.node_id}`);
          }
          for (const node of linkedNodes) {
            node.classList.add("mermaid-linked-node");
            node.dataset.groupIds = (link.group_ids ?? []).join(" ");
            node.dataset.termIds = (link.term_ids ?? []).join(" ");
            node.setAttribute("tabindex", "0");
            node.setAttribute("role", "button");
            const open = () => {
              const groupId = link.group_ids?.[0];
              if (!groupId) return;
              openInfluenceTarget({
                group_id: groupId,
                hunk_ids: link.hunk_ids ?? [],
                term_ids: link.term_ids ?? [],
              });
            };
            node.addEventListener("click", open);
            node.addEventListener("keydown", event => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                open();
              }
            });
          }
        }
      } catch (error) {
        output.append(element("div", "improvement-note", `図を描画できません: ${error.message}`));
      }
      card.append(output);
      syncReviewContext(activeGroupId);
      return card;
    }

    function renderGlossary() {
      if (!glossary.length) return;
      document.getElementById("glossary-section").hidden = false;
      const list = document.getElementById("glossary-list");
      list.replaceChildren(...glossary.map(entry => {
        const item = element("article", "glossary-entry");
        item.id = `term-${entry.id}`;
        item.append(
          element("h3", "glossary-term", entry.term),
          element("p", "glossary-definition", entry.definition),
        );
        return item;
      }));
    }

    function focusGlossaryTerm(termId) {
      for (const entry of document.querySelectorAll(".glossary-entry")) {
        entry.classList.toggle("context-active", entry.id === `term-${termId}`);
      }
      const target = document.getElementById(`term-${termId}`);
      target?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function syncReviewContext(groupId, termId = null) {
      for (const node of document.querySelectorAll(".mermaid-linked-node")) {
        const groupIds = node.dataset.groupIds?.split(" ").filter(Boolean) ?? [];
        node.classList.toggle("context-active", Boolean(groupId) && groupIds.includes(groupId));
      }
      if (termId) focusGlossaryTerm(termId);
    }

    function openInfluenceTarget(influence) {
      const group = groups.find(item => item.id === influence.group_id);
      if (!group) return;
      activeGroupId = group.id;
      renderGroupList();
      syncReviewContext(group.id, influence.term_ids?.[0] ?? null);
      const hunkId = influence.hunk_ids?.[0];
      requestAnimationFrame(() => {
        const target = hunkId ? document.getElementById("hunk-" + hunkId) : null;
        const fileBody = target?.closest(".file-diff-body");
        if (fileBody?.hidden) {
          fileBody.hidden = false;
          const fileKey = fileBody.dataset.fileKey;
          if (fileKey) state.fileCollapsed[fileKey] = false;
          fileBody.previousElementSibling
            ?.querySelector(".file-toggle")
            ?.setAttribute("aria-expanded", "true");
          saveState();
        }
        (target ?? document.getElementById(`group-section-${group.id}`)).scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
        if (target) target.open = true;
      });
    }
    function renderGroupList() {
      const list = document.getElementById("group-list");
      list.replaceChildren();
      const dependedGroupIds = new Set(groups.flatMap(group => group.depends_on ?? []));
      for (const group of groups) {
        const button = element("button", `group-row${group.id === activeGroupId ? " active" : ""}`);
        button.type = "button";
        button.style.setProperty("--group-color", groupColor(group.id));
        button.addEventListener("click", () => {
          activeGroupId = group.id;
          renderGroupList();
          syncReviewContext(group.id);
          document.getElementById(`group-section-${group.id}`)
            ?.scrollIntoView({ behavior: "smooth", block: "start" });
        });

        const main = element("div", "group-main");
        const titleLine = element("div", "group-title-line");
        titleLine.append(
          element("span", "group-color-dot"),
          element("span", "group-title", group.title),
        );
        main.append(titleLine, element("div", "group-summary", group.after));

        const marks = element("div", "badges");
        const dependencies = group.depends_on ?? [];
        if (dependencies.length) {
          const dependencyTitles = dependencies.map(dependencyId =>
            groups.find(item => item.id === dependencyId)?.title ?? dependencyId
          );
          main.append(element("div", "group-dependencies", `→ ${dependencyTitles.join(" / ")}`));
        }
        marks.append(badge(`${groups.indexOf(group) + 1}/${groups.length}`));
        if (!dependedGroupIds.has(group.id)) marks.append(badge("入口"));
        marks.append(badge(`${group.hunk_ids.length} hunks`));
        if (state.checked[group.id]) marks.append(badge("確認済み", "checked"));
        button.append(main, marks);
        list.append(button);
      }
    }

    function renderGroupSection(group) {
      const card = element("article", "detail-card");
      card.id = `group-section-${group.id}`;
      const head = element("div", "detail-head");
      head.style.setProperty("--group-color", groupColor(group.id));
      const copy = element("div");
      const title = element("h3", "detail-title");
      title.append(
        element("span", "group-color-dot"),
        document.createTextNode(group.title),
      );
      const explanation = element("p", "explanation");
      const focusLabel = element("strong", "", "ここで確認すること: ");
      explanation.append(focusLabel, document.createTextNode(group.review_focus));
      copy.append(title, explanation);

      const meta = element("div", "meta-grid");
      for (const [label, value] of [["変更前", group.before], ["変更後", group.after], ["この形にした理由", group.why]]) {
        const item = element("div", "meta-item");
        item.append(element("span", "meta-label", label), document.createTextNode(value));
        meta.append(item);
      }
      copy.append(meta);

      const check = element("label", "review-check");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = Boolean(state.checked[group.id]);
      checkbox.addEventListener("change", () => {
        state.checked[group.id] = checkbox.checked;
        saveState();
      });
      check.append(checkbox, document.createTextNode("確認済みにする"));
      head.append(copy, check);
      card.append(head);

      groupHunksByPath(group).forEach(file => card.append(renderFileDiff(group, file)));

      const commentBox = element("div", "group-comment");
      const commentLabel = document.createElement("label");
      const commentId = `group-comment-input-${group.id}`;
      commentLabel.htmlFor = commentId;
      commentLabel.textContent = "グループ全体へのコメント";
      const textarea = document.createElement("textarea");
      textarea.id = commentId;
      textarea.placeholder = "疑問、修正依頼、補足を入力";
      textarea.value = state.groupComments[group.id] ?? "";
      textarea.addEventListener("input", () => {
        state.groupComments[group.id] = textarea.value;
        saveState();
      });
      commentBox.append(commentLabel, textarea);
      card.append(commentBox);
      return card;
    }

    function renderAllGroups() {
      const container = document.getElementById("detail-card");
      if (!groups.length) {
        container.replaceChildren(element("div", "empty", "表示できる変更グループがありません。"));
        return;
      }
      container.replaceChildren(...groups.map(renderGroupSection));
    }

    function syncActiveGroupFromScroll() {
      const sections = [...document.querySelectorAll(".group-sections > .detail-card")];
      const hasScrollableDocument = document.documentElement.scrollHeight > window.innerHeight + 1;
      const atDocumentEnd = hasScrollableDocument && window.innerHeight + window.scrollY >=
        document.documentElement.scrollHeight - 1;
      const current = atDocumentEnd ? sections.at(-1) : sections.reduce((candidate, section) =>
        section.getBoundingClientRect().top <= 132 ? section : candidate, sections[0]
      );
      const groupId = current?.id.replace("group-section-", "");
      if (!groupId || groupId === activeGroupId) return;
      activeGroupId = groupId;
      renderGroupList();
      keepActiveGroupVisible();
      syncReviewContext(groupId);
    }

    function keepActiveGroupVisible() {
      const rail = document.querySelector(".group-rail");
      const row = rail?.querySelector(".group-row.active");
      if (!rail || !row) return;
      const railRect = rail.getBoundingClientRect();
      const rowRect = row.getBoundingClientRect();
      if (rowRect.top < railRect.top) rail.scrollTop += rowRect.top - railRect.top;
      else if (rowRect.bottom > railRect.bottom) rail.scrollTop += rowRect.bottom - railRect.bottom;
    }

    let activeGroupSyncPending = false;
    function scheduleActiveGroupSync() {
      if (activeGroupSyncPending) return;
      activeGroupSyncPending = true;
      requestAnimationFrame(() => {
        activeGroupSyncPending = false;
        syncActiveGroupFromScroll();
      });
    }

    function parseDiffLines(raw) {
      const lines = raw.replace(/\n$/, "").split("\n");
      let oldLine = null;
      let newLine = null;
      return lines.map((text, index) => {
        if (text.startsWith("@@")) {
          const match = text.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
          if (match) {
            oldLine = Number(match[1]);
            newLine = Number(match[2]);
          }
          return { index, text, type: "header", oldLine: "", newLine: "" };
        }
        if (text.startsWith("+")) {
          const result = { index, text, type: "add", oldLine: "", newLine };
          if (newLine !== null) newLine += 1;
          return result;
        }
        if (text.startsWith("-")) {
          const result = { index, text, type: "delete", oldLine, newLine: "" };
          if (oldLine !== null) oldLine += 1;
          return result;
        }
        const result = { index, text, type: "context", oldLine, newLine };
        if (oldLine !== null) oldLine += 1;
        if (newLine !== null) newLine += 1;
        return result;
      });
    }

    function highlightCode(cell, text, path, lineType) {
      if (lineType === "header") {
        cell.textContent = text;
        return;
      }
      const extension = path.split(".").pop()?.toLowerCase() ?? "";
      const languageByExtension = {
        js: "javascript", jsx: "jsx", ts: "typescript", tsx: "tsx",
        py: "python", rb: "ruby", sh: "bash", bash: "bash", zsh: "bash",
        go: "go", rs: "rust", java: "java", kt: "kotlin",
        c: "c", h: "c", cc: "cpp", cpp: "cpp", hpp: "cpp",
        json: "json", css: "css", scss: "css", sql: "sql",
        yaml: "yaml", yml: "yaml",
        html: "markup", htm: "markup", xml: "markup", vue: "markup", svelte: "markup",
        md: "markdown", markdown: "markdown",
      };
      const language = languageByExtension[extension];
      const hasDiffPrefix =
        lineType === "add" ||
        lineType === "delete" ||
        (lineType === "context" && text.startsWith(" "));
      const prefix = hasDiffPrefix ? text.slice(0, 1) : "";
      const code = hasDiffPrefix ? text.slice(1) : text;
      if (prefix) cell.append(element("span", "token-prefix", prefix));
      const grammar = language ? Prism.languages[language] : null;
      if (!grammar) {
        cell.append(document.createTextNode(code));
        return;
      }
      const highlighted = element("span", `language-${language}`);
      highlighted.innerHTML = Prism.highlight(code, grammar, language);
      cell.append(highlighted);
    }

    function renderHunk(group, hunk) {
      const container = element("section", "file-hunk");
      container.id = `hunk-${hunk.id}`;
      const meta = element("div", "hunk-meta");
      meta.append(
        element("span", "", hunk.id),
        badge(hunk.source),
        element("span", "", hunk.header),
      );
      container.append(meta);
      const scroll = element("div", "diff-scroll");
      const table = element("table", "diff-table");
      const body = document.createElement("tbody");
      for (const line of parseDiffLines(hunk.raw)) {
        const key = `${hunk.id}:${line.index}`;
        const row = element("tr", `diff-row ${line.type}`);
        row.append(
          element("td", "line-number", String(line.oldLine ?? "")),
          element("td", "line-number", String(line.newLine ?? "")),
        );
        const codeCell = element("td", "diff-code");
        highlightCode(codeCell, line.text, hunk.path, line.type);
        const commentButton = element("button", `line-comment-button${state.lineComments[key] ? " has-comment" : ""}`, "+");
        commentButton.type = "button";
        commentButton.title = "この行にコメント";
        commentButton.addEventListener("click", () => {
          const existing = body.querySelector(`[data-comment-key="${CSS.escape(key)}"]`);
          if (existing) {
            existing.remove();
            return;
          }
          const editor = element("tr", "line-comment-editor");
          editor.dataset.commentKey = key;
          const cell = document.createElement("td");
          cell.colSpan = 3;
          const textarea = document.createElement("textarea");
          textarea.placeholder = `${hunk.path}:${line.newLine || line.oldLine || "hunk"} へのコメント`;
          textarea.value = state.lineComments[key]?.text ?? "";
          textarea.addEventListener("input", () => {
            if (textarea.value) {
              state.lineComments[key] = {
                text: textarea.value,
                groupId: group.id,
                hunkId: hunk.id,
                path: hunk.path,
                oldLine: line.oldLine,
                newLine: line.newLine,
                snippet: line.text,
              };
              commentButton.classList.add("has-comment");
            } else {
              delete state.lineComments[key];
              commentButton.classList.remove("has-comment");
            }
            saveState();
          });
          cell.append(textarea);
          editor.append(cell);
          row.after(editor);
          textarea.focus();
        });
        codeCell.append(commentButton);
        row.append(codeCell);
        body.append(row);
      }
      table.append(body);
      scroll.append(table);
      container.append(scroll);
      return container;
    }

    function renderFileDiff(group, file) {
      const fileKey = `${group.id}:${file.path}`;
      const container = element("section", "file-diff");
      const header = element("header", "file-diff-header");
      const body = element("div", "file-diff-body");
      body.dataset.fileKey = fileKey;
      body.hidden = Boolean(state.fileCollapsed[fileKey]);
      const toggle = element("button", "file-toggle");
      toggle.type = "button";
      toggle.setAttribute("aria-expanded", String(!body.hidden));
      toggle.append(
        element("span", "file-path", file.path),
        badge(`${file.hunks.length} hunks`),
      );
      const setFileCollapsed = collapsed => {
        body.hidden = collapsed;
        state.fileCollapsed[fileKey] = collapsed;
        toggle.setAttribute("aria-expanded", String(!body.hidden));
      };
      toggle.addEventListener("click", () => {
        setFileCollapsed(!body.hidden);
        saveState();
      });
      const reviewCheck = element("label", "file-review-check");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = Boolean(state.fileChecked[fileKey]);
      checkbox.setAttribute("aria-label", `${file.path}を確認済みにする`);
      checkbox.addEventListener("change", () => {
        state.fileChecked[fileKey] = checkbox.checked;
        if (checkbox.checked) setFileCollapsed(true);
        saveState();
      });
      reviewCheck.append(checkbox, document.createTextNode("確認済み"));
      header.append(toggle, reviewCheck);
      for (const hunk of file.hunks) body.append(renderHunk(group, hunk));
      container.append(header, body);
      return container;
    }

    function commentCount() {
      const groupCount = Object.values(state.groupComments).filter(value => value.trim()).length;
      const lineCount = Object.values(state.lineComments).filter(value => value.text?.trim()).length;
      return groupCount + lineCount;
    }

    function updateProgress() {
      const checked = groups.filter(group => state.checked[group.id]).length;
      const percentage = groups.length ? (checked / groups.length) * 100 : 0;
      document.getElementById("progress-bar").style.width = `${percentage}%`;
      document.getElementById("progress-label").textContent = `確認 ${checked}/${groups.length}`;
    }

    function updateFeedbackCounts() {
      const container = document.getElementById("feedback-counts");
      const checked = groups.filter(group => state.checked[group.id]).length;
      const files = groups.flatMap(group => groupHunksByPath(group).map(
        file => `${group.id}:${file.path}`
      ));
      const checkedFiles = files.filter(fileKey => state.fileChecked[fileKey]).length;
      container.replaceChildren(
        badge(`確認済み ${checked}`, "checked"),
        badge(`未確認 ${groups.length - checked}`, groups.length === checked ? "" : "pending"),
        badge(`ファイル ${checkedFiles}/${files.length}`, checkedFiles === files.length ? "checked" : ""),
        badge(`コメント ${commentCount()}`),
      );
    }

    function buildFeedback() {
      const checked = groups.filter(group => state.checked[group.id]).length;
      const lines = [
        "# explain-diff フィードバック",
        "",
        `対象: ${snapshot.branch}`,
        `fingerprint: ${snapshot.fingerprint}`,
        `確認: ${checked}/${groups.length} groups`,
      ];
      const comments = [];
      for (const group of groups) {
        const groupComment = state.groupComments[group.id]?.trim();
        const lineComments = Object.values(state.lineComments).filter(
          comment => comment.groupId === group.id && comment.text?.trim()
        );
        if (!groupComment && !lineComments.length) continue;
        comments.push("", `### ${group.title}`);
        if (groupComment) comments.push("", `- グループコメント: ${groupComment}`);
        for (const comment of lineComments) {
          const location = comment.newLine || comment.oldLine || "hunk";
          comments.push(
            "",
            `- 対象: ${comment.path}:${location}`,
            `- diff: \`${comment.snippet.slice(0, 240).replace(/`/g, "\\`")}${comment.snippet.length > 240 ? "…" : ""}\``,
            `- コメント: ${comment.text.trim()}`,
          );
        }
      }
      if (comments.length) lines.push("", "## 人間コメント", ...comments);
      const unchecked = groups.filter(group => !state.checked[group.id]);
      if (unchecked.length) {
        lines.push("", "## 未確認", "", ...unchecked.map(group => `- ${group.title}`));
      }
      const uncheckedFiles = groups.flatMap(group =>
        groupHunksByPath(group)
          .filter(file => !state.fileChecked[`${group.id}:${file.path}`])
          .map(file => `${group.title} / ${file.path}`)
      );
      if (uncheckedFiles.length) {
        lines.push("", "## 未確認ファイル", "", ...uncheckedFiles.map(file => `- ${file}`));
      }
      return `${lines.join("\n")}\n`;
    }

    function generateFeedback() {
      feedback = buildFeedback();
      const output = document.getElementById("feedback-output");
      output.textContent = feedback;
      output.classList.add("visible");
      return feedback;
    }

    async function copyFeedback() {
      const text = feedback || generateFeedback();
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.append(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }
      const button = document.getElementById("copy-feedback");
      const original = button.textContent;
      button.textContent = "コピーしました";
      setTimeout(() => { button.textContent = original; }, 1400);
    }

    document.getElementById("generate-feedback").addEventListener("click", generateFeedback);
    document.getElementById("copy-feedback").addEventListener("click", copyFeedback);
    window.addEventListener("scroll", scheduleActiveGroupSync, { passive: true });
    renderHeader();
    renderStory();
    renderChangedFiles();
    renderGlossary();
    void renderOverview();
    renderGroupList();
    renderAllGroups();
    updateProgress();
    updateFeedbackCounts();
  </script>
</body>
</html>
